<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY Groove · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sen:wght@400..800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#1a2744;--sec:#3b5998;--acc:#e8a838;--bg:#f4f2ec;--card:#fff;--txt:#1a1a18;--mut:#999;--brd:#e0ddd5;--win:#2d6a2e;--loss:#b22;--tie:#a80;--radius:10px;--blue:#2563eb}
body{font-family:'Sen',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background-color 0.8s ease}
/* Admin grass field */
body.admin-mode{--bg:#e4edde;--brd:#c5d4bb}
#grassCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
body.admin-mode #grassCanvas{opacity:1}
.page-wrap{position:relative;z-index:1}
.sidebar{position:relative;z-index:201}
h1,h2,h3{font-family:'Sen',sans-serif;color:var(--pri)}
button{cursor:pointer;font-family:inherit}input,textarea,select{font-family:inherit}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}
/* Sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:56px;display:flex;flex-direction:column;align-items:center;padding:16px 0;z-index:200}
.sidebar-top{display:flex;flex-direction:column;align-items:center;gap:4px}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:8px}
.nav-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:none;background:transparent;color:rgba(26,39,68,0.22);font-size:22px;transition:all 0.25s;position:relative;margin:1px 0}
.nav-icon:hover{color:var(--pri);background:rgba(26,39,68,0.06);box-shadow:0 0 20px rgba(26,39,68,0.08)}
.nav-icon.active{color:var(--pri);background:rgba(26,39,68,0.08)}
.nav-icon.active::after{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--acc)}
.nav-icon .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%) translateX(-4px);background:var(--pri);color:#fff;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s,transform 0.15s;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.nav-icon:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}
/* Layout — full width */
.header{padding:20px 24px 12px;margin-left:56px}
.header-inner{max-width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{font-size:28px;line-height:1}
.header-team{font-size:22px;font-weight:800;color:var(--pri);letter-spacing:-0.5px}
.header-sub{font-size:9px;letter-spacing:4px;color:var(--acc);font-weight:700;margin-top:1px;text-transform:uppercase}
.header-record{font-size:13px;font-weight:700;color:var(--pri);letter-spacing:0.5px;background:rgba(26,39,68,0.04);padding:6px 14px;border-radius:8px;display:flex;align-items:center;gap:6px}
.header-record .rec-w{color:var(--win)}.header-record .rec-l{color:var(--loss)}.header-record .rec-t{color:var(--tie)}
.page-wrap{margin-left:56px;min-height:100vh}
.main{max-width:100%;margin:0 auto;padding:0 24px 60px}
.tab{display:none}.tab.active{display:block}
/* Hero */
.hero-section{text-align:center;padding:20px 0 28px}
.hero-btn{position:relative;padding:18px 56px;font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--acc) 0%,#d4912a 100%);border:none;border-radius:14px;cursor:pointer;box-shadow:0 6px 28px rgba(232,168,56,0.35);transition:all 0.4s;overflow:hidden;width:100%;max-width:100%}
.hero-btn:hover{box-shadow:0 8px 36px rgba(232,168,56,0.5);transform:translateY(-2px)}
.hero-btn:active{transform:translateY(0);box-shadow:0 3px 16px rgba(232,168,56,0.3)}
.hero-btn.signin{background:linear-gradient(135deg,#e07830 0%,#c4602a 100%);box-shadow:0 6px 28px rgba(224,120,48,0.35);letter-spacing:1px}
.hero-btn.signin:hover{box-shadow:0 8px 36px rgba(224,120,48,0.5)}
.hero-btn::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.12) 50%,transparent 70%);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
/* Quiet admin sign-in */
.admin-signin{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--brd);background:var(--card);border-radius:6px;font-size:11px;font-weight:500;color:var(--mut);transition:0.2s;box-shadow:none;opacity:0.6}
.admin-signin:hover{opacity:1;border-color:var(--pri);color:var(--pri)}
.admin-signin .g-logo{width:14px;height:14px}
/* Composer */
.composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.composer-overlay.open{display:flex}
.composer{background:var(--card);border-radius:16px;width:100%;max-width:780px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,0.18);padding:32px 36px}
.composer h2{font-size:20px;margin-bottom:16px}
.composer-type-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.type-btn{padding:8px 16px;border:1px solid var(--brd);background:var(--card);border-radius:8px;font-size:12px;font-weight:600;color:var(--mut);transition:0.15s;display:inline-flex;align-items:center;gap:5px}
.type-btn:hover{border-color:var(--pri);color:var(--pri)}
.type-btn.active{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(26,39,68,0.15)}
.cf{margin-bottom:14px}.cf label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px}
.cf input,.cf textarea{width:100%;padding:12px 14px;border:1px solid var(--brd);border-radius:8px;font-size:15px;transition:border-color 0.2s}
.cf input:focus,.cf textarea:focus{outline:none;border-color:var(--acc)}
.cf textarea{min-height:160px;resize:vertical;line-height:1.7}
.photo-drop{border:2px dashed var(--brd);border-radius:10px;padding:24px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer;transition:0.2s}
.photo-drop:hover{border-color:var(--acc);color:var(--acc)}
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-preview img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--brd)}
/* Game picker grid */
.game-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.gp-cell{padding:10px 6px;border:1px solid var(--brd);border-radius:8px;text-align:center;font-size:11px;font-weight:600;color:var(--mut);transition:0.15s;background:var(--card)}
.gp-cell.available{color:var(--pri);cursor:pointer;border-color:var(--pri);border-style:dashed}
.gp-cell.available:hover{background:rgba(26,39,68,0.04);box-shadow:0 2px 8px rgba(26,39,68,0.1)}
.gp-cell.selected{background:var(--pri);color:#fff;border-color:var(--pri);border-style:solid;box-shadow:0 2px 8px rgba(26,39,68,0.2)}
.gp-cell.taken{color:#ccc;background:#fafaf8;cursor:default}
.gp-cell .gp-label{font-size:10px;color:inherit;opacity:0.7;margin-top:2px}
/* Buttons */
.save-btn{padding:9px 24px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;box-shadow:0 2px 10px rgba(37,99,235,0.25);transition:all 0.2s;letter-spacing:0.3px}
.save-btn:hover{box-shadow:0 4px 16px rgba(37,99,235,0.35);transform:translateY(-1px)}
.cancel-btn{padding:9px 20px;background:transparent;color:var(--mut);border:1px solid var(--brd);border-radius:var(--radius);font-size:13px;font-weight:600;transition:0.15s}
.cancel-btn:hover{border-color:var(--pri);color:var(--pri)}
.del-btn{border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:600;padding:4px 8px;border-radius:4px;transition:all 0.15s;display:flex;align-items:center;gap:4px}
.del-btn:hover{color:var(--loss);background:rgba(187,34,34,0.04)}
.del-btn.confirm{color:#fff;background:var(--loss);border-radius:4px}
/* Feed & Posts — full width */
.feed{max-width:100%;margin:0 auto}
.post{background:var(--card);border:1px solid var(--brd);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.05);transition:box-shadow 0.2s}
.post:hover{box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.post-header{padding:18px 24px 8px;display:flex;justify-content:space-between;align-items:flex-start}
.post-author{font-weight:700;font-size:14px;color:var(--pri)}.post-date{font-size:11px;color:var(--mut)}
.post-title{font-size:22px;font-weight:800;color:var(--pri);padding:4px 24px 0}
.post-body{padding:10px 24px 20px;font-size:15px;line-height:1.8;color:#444;white-space:pre-wrap}
.post-photos{padding:0 24px 20px;display:flex;gap:8px;flex-wrap:wrap}
.post-photos img{max-width:100%;border-radius:8px;border:1px solid var(--brd)}
.post-score{padding:12px 22px;margin:4px 24px 12px;background:rgba(26,39,68,0.03);border-radius:8px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--pri);font-size:16px}
.result-tag{font-size:12px;font-weight:800;color:#fff;padding:3px 10px;border-radius:4px}
/* Comments */
.comments-section{padding:0 24px 12px}
.comments-toggle{border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:600;padding:4px 0;display:flex;align-items:center;gap:4px;transition:0.15s}
.comments-toggle:hover{color:var(--pri)}
.comments-list{padding:8px 0}
.comment{padding:8px 0;border-bottom:1px solid #f5f3ed;font-size:13px;line-height:1.5}
.comment:last-child{border:none}
.comment-author{font-weight:700;font-size:12px;color:var(--pri);display:inline}
.comment-date{font-size:10px;color:var(--mut);margin-left:6px}
.comment-text{margin-top:2px;color:#555}
.comment-form{display:flex;gap:8px;margin-top:8px}
.comment-form input{flex:1;padding:7px 10px;border:1px solid var(--brd);border-radius:6px;font-size:13px}
.comment-form input:focus{outline:none;border-color:var(--acc)}
.comment-form button{padding:7px 14px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;box-shadow:0 1px 6px rgba(37,99,235,0.2)}
.post-footer{padding:8px 24px 10px;border-top:1px solid #f0efe8;display:flex;justify-content:space-between;align-items:center}
/* Roster page — richer cards */
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.roster-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--radius);overflow:hidden;transition:box-shadow 0.2s}
.roster-card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.roster-card-top{padding:20px 16px 12px;text-align:center}
.roster-avatar{width:72px;height:72px;border-radius:36px;background:linear-gradient(135deg,#e0ddd5,#d0cdc5);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mut);overflow:hidden}
.roster-avatar img{width:100%;height:100%;object-fit:cover}
.roster-card .rname{font-weight:800;font-size:16px;color:var(--pri);margin-bottom:2px}
.roster-card .rnumber{font-size:12px;color:var(--acc);font-weight:700}
.roster-card .rposition{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px}
.roster-card-bio{font-size:13px;color:#666;line-height:1.5;padding:0 16px 14px;text-align:center}
.roster-card-expand{border-top:1px solid var(--brd);padding:8px 16px;display:flex;justify-content:center}
.roster-card-expand button{border:none;background:transparent;color:var(--mut);font-size:11px;font-weight:600;display:flex;align-items:center;gap:3px;transition:0.15s}
.roster-card-expand button:hover{color:var(--pri)}
.roster-card-detail{padding:0 16px 14px;border-top:1px solid #f5f3ed}
.roster-card-detail .detail-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid #f5f3ed}
.roster-card-detail .detail-row:last-child{border:none}
.roster-card-detail .detail-label{color:var(--mut);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:0.4px}
.roster-card-detail .detail-val{color:var(--pri);font-weight:700}
/* Roster edit mode (admin) */
.roster-card input,.roster-card textarea{border:1px solid var(--brd);background:transparent;outline:none;font-family:'Sen',sans-serif;border-radius:4px;padding:4px 6px;transition:border-color 0.2s}
.roster-card input:focus,.roster-card textarea:focus{border-color:var(--acc)}
.roster-card .rn-input{font-size:16px;font-weight:800;color:var(--pri);width:100%;text-align:center}
.roster-card .rnum-input{font-size:12px;font-weight:700;color:var(--acc);width:50px;text-align:center}
.roster-card .rpos-input{font-size:11px;font-weight:600;color:var(--mut);width:80px;text-align:center;text-transform:uppercase}
.roster-card .rbio-input{font-size:12px;color:#666;width:100%;text-align:center;resize:vertical;min-height:50px;line-height:1.4}
/* Add player card */
.roster-card-add{background:transparent;border:2px dashed var(--brd);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;cursor:pointer;transition:all 0.2s;color:var(--mut)}
.roster-card-add:hover{border-color:var(--acc);color:var(--acc);background:rgba(232,168,56,0.03)}
.roster-card-add .material-symbols-outlined{font-size:36px;margin-bottom:6px}
.roster-card-add span:last-child{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
/* Other tabs — full width */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.card-pad{padding:16px 18px}
.sec-title{font-size:24px;font-weight:900;margin-bottom:6px;letter-spacing:-0.5px}
.sec-hint{font-size:13px;color:var(--mut);font-style:italic;margin-bottom:18px}
.table-wrap{overflow-x:auto;margin-top:8px;border-radius:var(--radius);border:1px solid var(--brd)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 6px;background:var(--pri);color:#fff;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;text-align:center;white-space:nowrap}
th:first-child{text-align:left;padding-left:12px}
td{padding:5px 5px;text-align:center;border-bottom:1px solid #f0efe8;font-size:13px}
td:first-child{text-align:left;padding-left:12px}tr:nth-child(even){background:#faf9f6}
.cell-input{border:none;background:transparent;outline:none;font-size:13px;text-align:center;width:36px;padding:2px}
.cell-input:focus{background:rgba(232,168,56,0.08);border-radius:3px}
.cell-input.wide{width:110px;text-align:left}
.total-row td{font-weight:700;color:var(--pri);border-top:2px solid var(--pri);background:rgba(26,39,68,0.03);font-size:12px}
.calc-cell{font-weight:700;color:var(--pri)}
.rm-btn{border:none;background:transparent;color:#ddd;cursor:pointer;font-size:13px;transition:0.15s}.rm-btn:hover{color:var(--loss)}
/* Box score row — draggable + selectable */
tr.bs-row{transition:background 0.15s}
tr.bs-row:hover{background:rgba(232,168,56,0.03)}
tr.bs-row.selected{background:rgba(37,99,235,0.06)}
tr.bs-row.selected td:first-child{border-left:3px solid var(--blue)}
tr.bs-row.dragging{opacity:0.4;background:rgba(232,168,56,0.1)}
tr.bs-row .drag-handle{cursor:grab;color:#ccc;font-size:16px;padding:0 4px;user-select:none;touch-action:none;display:flex;align-items:center}
tr.bs-row .drag-handle:active{cursor:grabbing;color:var(--acc)}
tr.bs-row .row-check{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;margin:0}
.bs-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;min-height:32px}
.bs-toolbar .sel-count{font-size:11px;font-weight:700;color:var(--blue)}
.bs-toolbar .del-selected{padding:4px 12px;background:var(--loss);color:#fff;border:none;border-radius:var(--radius);font-size:11px;font-weight:700;cursor:pointer;transition:0.15s;display:inline-flex;align-items:center;gap:4px}
.bs-toolbar .del-selected:hover{opacity:0.85}
/* ═══ UNIFIED BUTTON SYSTEM — all interactive elements share one shape ═══ */
.btn{padding:8px 16px;background:var(--pri);color:#fff;border:none;border-radius:var(--radius);font-size:12px;font-weight:600;transition:all 0.15s;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.btn:hover{opacity:0.9;box-shadow:0 3px 12px rgba(0,0,0,0.18)}
.btn-sm{padding:5px 12px;font-size:11px}.btn-danger{background:var(--loss)}
.btn-ghost{background:transparent;color:var(--mut);border:1px dashed var(--brd);box-shadow:none}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc);opacity:1;background:rgba(232,168,56,0.03)}
.game-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.game-tab{padding:6px 14px;border:1px solid var(--brd);background:#fff;border-radius:var(--radius);font-size:11px;font-weight:600;color:#666;transition:0.15s}
.game-tab:hover{border-color:var(--pri)}
.game-tab.active{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(26,39,68,0.2)}
.game-tab-add{padding:6px 14px;border:2px dashed var(--brd);background:transparent;border-radius:var(--radius);font-size:11px;font-weight:600;color:var(--mut);transition:0.15s;display:inline-flex;align-items:center;gap:4px}
.game-tab-add:hover{border-color:var(--acc);color:var(--acc)}
.game-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-bottom:14px}
.game-form label{font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:2px}
.game-form input,.game-form select{width:100%;padding:6px 8px;border:1px solid var(--brd);border-radius:var(--radius);font-size:13px;font-family:'Sen',sans-serif}
.game-form input:focus,.game-form select:focus{outline:none;border-color:var(--acc)}
/* Player roster picker above box score */
.roster-picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 14px;background:rgba(26,39,68,0.02);border-radius:var(--radius)}
.roster-picker-chip{padding:5px 12px;border:1px solid var(--brd);background:var(--card);border-radius:var(--radius);font-size:11px;font-weight:600;color:var(--pri);cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:4px}
.roster-picker-chip:hover{border-color:var(--acc);background:rgba(232,168,56,0.06)}
.roster-picker-chip.selected{background:var(--pri);color:#fff;border-color:var(--pri)}
.roster-picker-chip .rp-num{font-size:9px;opacity:0.6}
/* Player name chip — used in posts, box scores, everywhere a Groove player appears */
.player-chip{display:inline;font-weight:700;color:var(--pri);background:linear-gradient(135deg,rgba(232,168,56,0.1),rgba(232,168,56,0.05));padding:1px 7px;border-radius:4px;font-size:inherit;white-space:nowrap}
.player-chip .pc-num{font-size:0.8em;color:var(--acc);font-weight:800;margin-left:2px}
/* Box score notes */
.box-notes{margin-top:12px}
.box-notes label{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px}
.box-notes textarea{width:100%;padding:10px 12px;border:1px solid var(--brd);border-radius:6px;font-size:14px;line-height:1.6;resize:vertical;min-height:80px;font-family:'Sen',sans-serif}
.box-notes textarea:focus{outline:none;border-color:var(--acc)}
.leaders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.leader-title{font-size:11px;font-weight:700;color:var(--sec);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.leader-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f5f3ed}.leader-row:last-child{border:none}
.leader-name{font-size:13px}.leader-name.top{font-weight:700;color:var(--pri)}
.leader-val{font-weight:700;color:var(--pri);font-size:13px}

/* ═══ SEASON MANAGEMENT ═══ */
const SEASONS = ['2024','2026'];

function STORE() { return 'groove-stathub-' + activeSeason }
function DOC_ID() { return activeSeason }

const DEFAULT_STATS=[{id:'pa',label:'PA',full:'Plate Appearances',on:true},{id:'ab',label:'AB',full:'At Bats',on:true},{id:'r',label:'R',full:'Runs',on:true},{id:'h',label:'H',full:'Hits',on:true},{id:'singles',label:'1B',full:'Singles',on:true},{id:'doubles',label:'2B',full:'Doubles',on:true},{id:'triples',label:'3B',full:'Triples',on:true},{id:'hr',label:'HR',full:'Home Runs',on:true},{id:'rbi',label:'RBI',full:'RBI',on:true},{id:'bb',label:'BB',full:'Walks',on:true},{id:'so',label:'K',full:'Strikeouts',on:true},{id:'hbp',label:'HBP',full:'Hit-by-Pitch',on:true},{id:'sf',label:'SF',full:'Sac Flies',on:true},{id:'sb',label:'SB',full:'Stolen Bases',on:true},{id:'cs',label:'CS',full:'Caught Stealing',on:true},{id:'gidp',label:'GIDP',full:'Grounded Into DP',on:true}];
const DEFAULT_CFG={teamName:'NY Groove',seasonLabel:'2026',stats:DEFAULT_STATS,journalSections:[],statNotes:"Note: Does not count rainouts.\n\nRBIs may be incomplete for early-season games.",showHome:true,showRoster:true,showBoxScores:true,showPlayerStats:true,showLeaderboards:true,showTrendTracker:true,showStatNotes:true,messageToClaude:'',messageToHarry:'',customNotes:''};

function n(v){const p=parseFloat(v);return isNaN(p)?0:p}
function avg3(h,ab){return ab>0?(h/ab).toFixed(3):'—'}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function enabledStats(){return(D.cfg.stats||[]).filter(s=>s.on)}

/* ═══ PLAYER NAME CHIPS ═══ */
// Build a lookup: lowercase name -> {name, number}
function rosterMap(){
  const m={};
  D.roster.forEach(r=>{if(r.name)m[r.name.trim().toLowerCase()]={name:r.name,number:r.number||''}});
  return m;
}
// Render a player name as a highlighted chip if they're on the roster
function playerChip(name){
  if(!name)return '';
  const rm=rosterMap();
  const entry=rm[name.trim().toLowerCase()];
  if(entry){
    return `<span class="player-chip">${esc(entry.name)}${entry.number?'<span class="pc-num">#'+esc(entry.number)+'</span>':''}</span>`;
  }
  return esc(name);
}
// Replace roster player names in free text with chips
function chipifyText(text){
  if(!text)return '';
  const rm=rosterMap();
  let safe=esc(text);
  // Sort names longest-first to avoid partial matches
  const names=Object.values(rm).sort((a,b)=>b.name.length-a.name.length);
  names.forEach(r=>{
    const escaped=esc(r.name);
    const chip=`<span class="player-chip">${escaped}${r.number?'<span class="pc-num">#'+esc(r.number)+'</span>':''}</span>`;
    // Case-insensitive replace, word boundary aware
    const re=new RegExp('\\b'+escaped.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    safe=safe.replace(re,chip);
  });
  return safe;
}

function fmtDate(ts){
  if(!ts)return '';
  const d=new Date(typeof ts==='number'?ts:ts+'T12:00:00');
  if(isNaN(d))return ts;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mon=months[d.getMonth()];const day=d.getDate();
  let hr=d.getHours();const min=d.getMinutes().toString().padStart(2,'0');
  const ampm=hr>=12?'pm':'am';hr=hr%12||12;
  return `${mon} ${day} @ ${hr}:${min}${ampm} ET`;
}
function fmtDateShort(ts){
  if(!ts)return '';
  const d=new Date(typeof ts==='number'?ts:ts+'T12:00:00');
  if(isNaN(d))return ts;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}

/* ═══ TEAM RECORD ═══ */
function getRecord(){
  let w=0,l=0,t=0;
  D.games.forEach(g=>{
    const rf=n(g.runsFor),ra=n(g.runsAgainst);
    if(!g.runsFor&&!g.runsAgainst) return;
    if(rf>ra)w++;else if(rf<ra)l++;else t++;
  });
  return {w,l,t};
}

/* ═══ DATA PERSISTENCE ═══ */
let firestoreUnsubscribe = null;
let savingInProgress = false; // prevent onSnapshot feedback loop

function loadData(cb) {
  if (firebaseReady && db) {
    db.collection('stathub').doc(DOC_ID()).get().then(snap => {
      if (snap.exists) {
        applySnapshot(snap.data());
      } else {
        loadFromLocalStorage();
      }
      if (cb) cb();
    }).catch(e => {
      console.error('Firestore load failed, using localStorage:', e);
      loadFromLocalStorage();
      if (cb) cb();
    });
  } else {
    loadFromLocalStorage();
    if (cb) cb();
  }
}

function startRealtimeSync() {
  if (!firebaseReady || !db || firestoreUnsubscribe) return;
  firestoreUnsubscribe = db.collection('stathub').doc(DOC_ID()).onSnapshot(snap => {
    if (savingInProgress) return; // ignore our own writes
    if (snap.exists) {
      applySnapshot(snap.data());
      renderAll();
    }
  }, err => console.error('Realtime sync error:', err));
}

function stopRealtimeSync() {
  if (firestoreUnsubscribe) { firestoreUnsubscribe(); firestoreUnsubscribe = null; }
}

function applySnapshot(d) {
  D.cfg = { ...DEFAULT_CFG, ...(d.cfg || {}) };
  D.games = d.games || [];
  D.roster = d.roster || [];
  D.posts = d.posts || [];
  D.posts.forEach(p => { if (!p.comments) p.comments = [] });
  D.roster.forEach(r => { if (!r.position) r.position = ''; if (!r.bio) r.bio = '' });
}

function loadFromLocalStorage(){
  try{const r=localStorage.getItem(STORE());if(r){applySnapshot(JSON.parse(r))}}catch(e){console.error(e)}
}

function saveNow(btn) {
  // Show saving state on the triggering button if provided
  const origText = btn ? btn.textContent : null;
  if (btn) { btn.textContent = 'Saving...'; btn.disabled = true; btn.style.opacity = '0.7' }

  // Always save to localStorage as backup
  try { localStorage.setItem(STORE(), JSON.stringify(D)) } catch(e) { console.error(e) }

  // Save to Firestore if available and user is admin
  if (firebaseReady && db && isAdmin()) {
    savingInProgress = true;
    const payload = JSON.parse(JSON.stringify(D));
    db.collection('stathub').doc(DOC_ID()).set(payload)
      .then(() => {
        setTimeout(() => { savingInProgress = false }, 500);
        if (btn) { btn.textContent = '✓ Saved'; btn.disabled = false; btn.style.opacity = '1'; setTimeout(() => { if(btn.isConnected) btn.textContent = origText }, 2000) }
      })
      .catch(e => {
        console.error('Firestore save failed:', e);
        savingInProgress = false;
        if (btn) { btn.textContent = '✗ Save failed'; btn.disabled = false; btn.style.opacity = '1'; btn.style.color = 'var(--loss)'; setTimeout(() => { if(btn.isConnected){ btn.textContent = origText; btn.style.color = '' }}, 3000) }
      });
  } else {
    // Local-only: just confirm
    if (btn) { btn.textContent = '✓ Saved locally'; btn.disabled = false; btn.style.opacity = '1'; setTimeout(() => { if(btn.isConnected) btn.textContent = origText }, 2000) }
  }
}

/* ═══ AUTH ═══ */

    bar.innerHTML=`<button class="admin-signin" onclick="signIn()"><svg class="g-logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Admin</button>`;
  }
}
function isSignedIn(){return !!currentUser}

if(firebaseReady&&auth){

/* ═══ SIDEBAR ═══ */
const TABS=[
  {id:'home',icon:'home',label:'Feed',cfg:'showHome'},
  {id:'roster',icon:'groups',label:'Roster',cfg:'showRoster'},
  {id:'boxscores',icon:'scoreboard',label:'Box Scores',cfg:'showBoxScores'},
  {id:'playerstats',icon:'person',label:'Player Stats',cfg:'showPlayerStats'},
  {id:'leaderboards',icon:'emoji_events',label:'Leaderboards',cfg:'showLeaderboards'},
  {id:'trendtracker',icon:'trending_up',label:'TrendTracker',cfg:'showTrendTracker'},
  {id:'statnotes',icon:'sticky_note_2',label:'Stat Notes',cfg:'showStatNotes'},
];
function renderNav(){
  let html='<div class="sidebar-top">';
  TABS.forEach(t=>{if(t.cfg&&!D.cfg[t.cfg])return;html+=`<button class="nav-icon${activeTab===t.id?' active':''}" onclick="activeTab='${t.id}';renderAll()"><span class="material-symbols-outlined">${t.icon}</span><span class="tip">${t.label}</span></button>`});
  html+=`</div><div class="sidebar-bottom"><button class="nav-icon${activeTab==='settings'?' active':''}" onclick="activeTab='settings';renderAll()"><span class="material-symbols-outlined">settings</span><span class="tip">Settings</span></button></div>`;
  document.getElementById('sidebar').innerHTML=html;
}
function renderTabs(){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));const el=document.getElementById('tab-'+activeTab);if(el)el.classList.add('active')}

/* ═══ HEADER RECORD ═══ */
function renderRecord(){
  const rec=getRecord();
  const el=document.getElementById('headerRecord');
  if(!rec.w&&!rec.l&&!rec.t){el.innerHTML='';return}
  let parts=[];
  parts.push(`<span class="rec-w">${rec.w}W</span>`);
  parts.push(`<span class="rec-l">${rec.l}L</span>`);
  if(rec.t)parts.push(`<span class="rec-t">${rec.t}T</span>`);
  el.innerHTML=parts.join(' – ');
}

/* ═══ ROSTER PAGE ═══ */
function renderRoster(){
  const grid=document.getElementById('rosterGrid');
  const admin=isAdmin();
  const hint=document.getElementById('rosterHint');
  if(hint) hint.textContent='The '+activeSeason+' New York Groove.';
  let html='';

  D.roster.forEach((r,i)=>{
    const expanded=expandedRoster[r.id];
    if(admin){
      // Editable cards
      html+=`<div class="roster-card"><div class="roster-card-top"><div class="roster-avatar"><span class="material-symbols-outlined" style="font-size:28px">person</span></div><input class="rn-input" value="${esc(r.name)}" placeholder="Name" oninput="D.roster[${i}].name=this.value"><div style="display:flex;gap:4px;justify-content:center;margin-top:4px"><input class="rnum-input" value="${esc(r.number?'#'+r.number:'')}" placeholder="#00" oninput="D.roster[${i}].number=this.value.replace('#','')"><input class="rpos-input" value="${esc(r.position||'')}" placeholder="POS" oninput="D.roster[${i}].position=this.value"></div></div><div style="padding:0 12px 8px"><textarea class="rbio-input" placeholder="Bio / hometown / fun fact..." oninput="D.roster[${i}].bio=this.value">${esc(r.bio||'')}</textarea></div><div style="padding:0 12px 10px;text-align:center"><button class="rm-btn" style="font-size:11px" onclick="delRosterPlayer(${i},this)">Remove</button></div></div>`;
    } else {
      // Read-only rich cards
      html+=`<div class="roster-card"><div class="roster-card-top"><div class="roster-avatar"><span class="material-symbols-outlined" style="font-size:28px">person</span></div><div class="rname">${esc(r.name)||'—'}</div>`;
      if(r.number)html+=`<div class="rnumber">#${esc(r.number)}</div>`;
      if(r.position)html+=`<div class="rposition">${esc(r.position)}</div>`;
      html+=`</div>`;
      if(r.bio)html+=`<div class="roster-card-bio">${esc(r.bio)}</div>`;
      // Expandable stats summary
      html+=`<div class="roster-card-expand"><button onclick="expandedRoster['${r.id}']=!expandedRoster['${r.id}'];renderRoster()"><span class="material-symbols-outlined" style="font-size:16px">${expanded?'expand_less':'expand_more'}</span>${expanded?'Less':'Stats'}</button></div>`;
      if(expanded){
        const stats=getPlayerStatsByName(r.name);
        html+=`<div class="roster-card-detail">`;
        if(stats){
          html+=`<div class="detail-row"><span class="detail-label">GP</span><span class="detail-val">${stats.gp}</span></div>`;
          html+=`<div class="detail-row"><span class="detail-label">AVG</span><span class="detail-val">${avg3(stats.h||0,stats.ab||0)}</span></div>`;
          ['h','hr','rbi','r','bb','sb'].forEach(k=>{
            const s=enabledStats().find(x=>x.id===k);
            if(s&&stats[k])html+=`<div class="detail-row"><span class="detail-label">${esc(s.label)}</span><span class="detail-val">${stats[k]}</span></div>`;
          });
        }else{
          html+=`<div style="padding:8px 0;font-size:12px;color:var(--mut);text-align:center">No stats yet</div>`;
        }
        html+=`</div>`;
      }
      html+=`</div>`;
    }
  });

  // Add player card (admin only)
  if(admin){
    html+=`<div class="roster-card-add" onclick="D.roster.push({id:uid(),name:'',number:'',position:'',bio:''});renderRoster()"><span class="material-symbols-outlined">person_add</span><span>Add Player</span></div>`;
  }

  grid.innerHTML=html;

  // Admin buttons area
  const adminBtns=document.getElementById('rosterAdminBtns');
  if(admin){
    adminBtns.innerHTML=`<button class="save-btn" onclick="saveNow(this)">Save Roster</button>`;
  }else{
    adminBtns.innerHTML='';
  }
}

function getPlayerStatsByName(name){
  if(!name)return null;
  const key=name.trim().toLowerCase();
  const totals=getPlayerTotals();
  return totals.find(p=>p.name.trim().toLowerCase()===key)||null;
}

function delRosterPlayer(i,btn){
  if(btn.dataset.confirm){D.roster.splice(i,1);renderRoster();return}
  btn.dataset.confirm='1';btn.textContent='Click again to confirm';btn.style.color='var(--loss)';btn.style.fontWeight='700';
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.confirm;btn.textContent='Remove';btn.style.color='';btn.style.fontWeight=''}},3000);
}

/* ═══ COMPOSER ═══ */
function openComposer(){composerType='recap';composerData={title:'',body:'',author:currentUser?currentUser.displayName||'':'',photos:[]};composerGameId=null;renderComposer();document.getElementById('composerOverlay').classList.add('open')}
function closeComposer(){document.getElementById('composerOverlay').classList.remove('open')}

function renderComposer(){
  const types=[{id:'recap',label:'Game Recap',icon:'scoreboard'},{id:'photo',label:'Photos',icon:'photo_camera'},{id:'dataviz',label:'Data / Stats',icon:'bar_chart'},{id:'note',label:'Note',icon:'edit_note'}];
  let html=`<h2>Post Something</h2><div class="composer-type-row">`;
  types.forEach(t=>{html+=`<button class="type-btn${composerType===t.id?' active':''}" onclick="composerType='${t.id}';composerGameId=null;renderComposer()"><span class="material-symbols-outlined" style="font-size:16px">${t.icon}</span>${t.label}</button>`});
  html+=`</div>`;
  html+=`<div class="cf"><label>Author</label><input value="${esc(composerData.author)}" placeholder="Your name" oninput="composerData.author=this.value"></div>`;

  if(composerType==='recap'){
    const taken=recapGameIds();
    html+=`<div class="cf"><label>Select a game</label>`;
    if(!D.games.length){html+=`<p style="font-size:13px;color:var(--mut)">No box scores yet. Create games in Box Scores first.</p>`}
    else{
      html+=`<div class="game-picker">`;
      D.games.forEach((g,i)=>{
        const hasCap=taken.has(g.id);const sel=composerGameId===g.id;
        const cls=sel?'selected':hasCap?'taken':'available';
        const lbl=g.opponent?`vs ${esc(g.opponent)}`:`Game ${i+1}`;
        const sub=g.date?fmtDateShort(g.date):'';
        if(!hasCap){
          html+=`<div class="gp-cell ${cls}" onclick="composerGameId='${g.id}';renderComposer()"><div style="font-size:12px;font-weight:700">${lbl}</div>${sub?`<div class="gp-label">${sub}</div>`:''}</div>`;
        }else{
          html+=`<div class="gp-cell ${cls}"><div style="font-size:12px">✓ ${lbl}</div>${sub?`<div class="gp-label">${sub}</div>`:''}</div>`;
        }
      });
      html+=`</div>`;
    }
    html+=`</div>`;
    html+=`<div class="cf"><label>Title</label><input value="${esc(composerData.title)}" placeholder="e.g. A Slugfest in the Rain" oninput="composerData.title=this.value"></div>`;
    html+=`<div class="cf"><label>Write-up</label><textarea placeholder="The full story of this game — etched into history..." oninput="composerData.body=this.value" style="min-height:200px">${esc(composerData.body)}</textarea></div>`;
  }else if(composerType==='photo'){
    html+=`<div class="cf"><label>Caption</label><input value="${esc(composerData.title)}" placeholder="What's in the photo?" oninput="composerData.title=this.value"></div>`;
    html+=`<div class="cf"><label>Photos</label><div class="photo-drop" onclick="document.getElementById('photoInput').click()">Click to upload photos</div><input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(this.files)"><div class="photo-preview" id="photoPreview"></div></div>`;
    html+=`<div class="cf"><label>Description</label><textarea placeholder="Story behind these photos..." oninput="composerData.body=this.value" style="min-height:160px">${esc(composerData.body)}</textarea></div>`;
  }else if(composerType==='dataviz'){
    html+=`<div class="cf"><label>Title</label><input value="${esc(composerData.title)}" placeholder="e.g. RBI Trends Through Game 10" oninput="composerData.title=this.value"></div>`;
    html+=`<div class="cf"><label>Analysis</label><textarea placeholder="What does the data show?" oninput="composerData.body=this.value" style="min-height:160px">${esc(composerData.body)}</textarea></div>`;
    html+=`<div class="cf"><label>Image (optional)</label><div class="photo-drop" onclick="document.getElementById('photoInput').click()">Upload chart / visualization</div><input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(this.files)"><div class="photo-preview" id="photoPreview"></div></div>`;
  }else{
    html+=`<div class="cf"><label>Title (optional)</label><input value="${esc(composerData.title)}" placeholder="Quick update" oninput="composerData.title=this.value"></div>`;
    html+=`<div class="cf"><label>Note</label><textarea placeholder="What's on your mind, Groove member?" oninput="composerData.body=this.value" style="min-height:200px">${esc(composerData.body)}</textarea></div>`;
  }
  html+=`<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="cancel-btn" onclick="closeComposer()">Cancel</button><button class="save-btn" onclick="publishPost()">Save & Publish</button></div>`;
  document.getElementById('composerInner').innerHTML=html;
  if(composerData.photos&&composerData.photos.length){const pp=document.getElementById('photoPreview');if(pp)pp.innerHTML=composerData.photos.map(p=>`<img src="${p}">`).join('')}
}
function handlePhotos(files){Array.from(files).forEach(f=>{const r=new FileReader();r.onload=e=>{composerData.photos.push(e.target.result);renderComposer()};r.readAsDataURL(f)})}

function publishPost(){
  let opponent='',runsFor='',runsAgainst='',gameDate='';
  if(composerType==='recap'&&composerGameId){
    const g=D.games.find(x=>x.id===composerGameId);
    if(g){opponent=g.opponent||'';runsFor=g.runsFor||'';runsAgainst=g.runsAgainst||'';gameDate=g.date||''}
  }
  const post={id:uid(),type:composerType,title:composerData.title||'',body:composerData.body||'',
    author:composerData.author||'Anonymous Groover',
    date:composerType==='recap'&&gameDate?gameDate:new Date().toISOString().slice(0,10),
    createdAt:Date.now(),photos:composerData.photos||[],
    opponent,runsFor,runsAgainst,gameId:composerGameId||'',
    comments:[]};
  D.posts.unshift(post);saveNow();closeComposer();activeTab='home';renderAll();
}

/* ═══ FEED ═══ */
function renderFeed(){
  const area=document.getElementById('feedArea');
  if(!D.posts.length){area.innerHTML='<div class="empty"><div class="empty-text" style="font-size:18px;color:#bbb;margin-top:20px">Nothing here yet.</div><p style="color:#ccc;font-size:13px;margin-top:6px">Hit the button to make history.</p></div>';return}
  const admin=isAdmin();
  let html='';
  D.posts.forEach((p,i)=>{
    html+=`<div class="post">`;
    html+=`<div class="post-header"><div><div class="post-author">${playerChip(p.author)}</div><div class="post-date">${fmtDate(p.createdAt||p.date)}</div></div></div>`;
    if(p.title)html+=`<div class="post-title">${chipifyText(p.title)}</div>`;
    if(p.type==='recap'&&p.runsFor){
      const w=n(p.runsFor)>n(p.runsAgainst),l=n(p.runsFor)<n(p.runsAgainst),r=w?'W':l?'L':'T',bg=w?'var(--win)':l?'var(--loss)':'var(--tie)';
      html+=`<div class="post-score"><span class="result-tag" style="background:${bg}">${r}</span><span>${esc(p.runsFor)} – ${esc(p.runsAgainst)}</span><span style="font-weight:400;font-size:13px;color:var(--mut)">vs ${esc(p.opponent)}</span></div>`;
    }
    if(p.body)html+=`<div class="post-body">${chipifyText(p.body)}</div>`;
    if(p.photos&&p.photos.length){html+=`<div class="post-photos">`;p.photos.forEach(ph=>{html+=`<img src="${ph}" style="max-height:360px">`});html+=`</div>`}
    const commOpen=openComments[p.id];
    const cc=p.comments||[];
    html+=`<div class="comments-section">`;
    html+=`<button class="comments-toggle" onclick="openComments['${p.id}']=!openComments['${p.id}'];renderFeed()"><span class="material-symbols-outlined" style="font-size:16px">${commOpen?'expand_less':'chat_bubble'}</span>${cc.length?cc.length+' comment'+(cc.length>1?'s':''):'Add a comment'}${commOpen?' — hide':''}</button>`;
    if(commOpen){
      html+=`<div class="comments-list">`;
      cc.forEach((c,ci)=>{
        html+=`<div class="comment"><div><span class="comment-author">${playerChip(c.author)}</span><span class="comment-date">${fmtDate(c.createdAt)}</span></div><div class="comment-text">${chipifyText(c.text)}</div></div>`;
      });
      html+=`</div>`;
      html+=`<div class="comment-form"><input id="cmt-${p.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button onclick="addComment('${p.id}')">Post</button></div>`;
    }
    html+=`</div>`;
    html+=`<div class="post-footer"><div></div>`;
    if(admin){html+=`<button class="del-btn" id="del-${p.id}" onclick="delPost(${i},this)"><span class="material-symbols-outlined" style="font-size:16px">delete</span>Delete</button>`}
    html+=`</div>`;
    html+=`</div>`;
  });
  area.innerHTML=html;
}

function addComment(postId){
  const input=document.getElementById('cmt-'+postId);if(!input)return;
  const text=input.value.trim();if(!text)return;
  const post=D.posts.find(p=>p.id===postId);if(!post)return;
  if(!post.comments)post.comments=[];
  post.comments.push({id:uid(),author:currentUser?currentUser.displayName||'Groove Member':'Groove Member',text,createdAt:Date.now()});
  saveNow();renderFeed();
}

function delPost(i,btn){
  if(btn.classList.contains('confirm')){D.posts.splice(i,1);saveNow();renderFeed();return}
  btn.classList.add('confirm');btn.innerHTML='<span class="material-symbols-outlined" style="font-size:16px">warning</span>Click again to delete';
  setTimeout(()=>{if(btn.isConnected){btn.classList.remove('confirm');btn.innerHTML='<span class="material-symbols-outlined" style="font-size:16px">delete</span>Delete'}},3000);
}

function heroClick(){
  if(!isAdmin()){return}
  openComposer();
}

function renderHome(){
  document.getElementById('headerTeam').textContent=D.cfg.teamName;
  // Season bar — large tabs at top
  const sb=document.getElementById('seasonBar');
  sb.innerHTML=SEASONS.map(y=>`<button class="season-tab season-tab-${y}${activeSeason===y?' active':''}" onclick="switchSeason('${y}')">${y} Season</button>`).join('');
  // Apply season body class for color scheme
  SEASONS.forEach(y=>document.body.classList.remove('season-'+y));
  document.body.classList.add('season-'+activeSeason);
  renderRecord();
  const btn=document.getElementById('heroBtn');
  if(btn){
    if(isAdmin()){
      btn.className='hero-btn';
      btn.textContent='POST SOMETHING';
      btn.style.display='';
    }else{
      btn.style.display='none';
    }
  }
  renderFeed();
  renderAuthBar();
  const ft=document.getElementById('siteFooter');if(ft)ft.textContent='NY Groove · '+activeSeason;
}

/* ═══ BOX SCORES ═══ */
function addGame(){const g={id:uid(),date:'',opponent:'',location:'',runsFor:'',runsAgainst:'',weather:'',notes:'',players:D.roster.map(r=>({id:uid(),name:r.name,rosterId:r.id}))};D.games.push(g);activeGame=g.id;activeTab='boxscores';renderAll()}
function renderBoxScores(){
  const admin=isAdmin();
  // Admin buttons area (clear — new game is in the tab row now)
  const adminBtns=document.getElementById('boxAdminBtns');
  adminBtns.innerHTML='';

  // Game tabs + new game chip
  const gt=document.getElementById('gameTabs');gt.innerHTML='';
  D.games.forEach((g,i)=>{const b=document.createElement('button');b.className='game-tab'+(activeGame===g.id?' active':'');b.textContent=g.date?fmtDateShort(g.date):`Game ${i+1}`;b.onclick=()=>{activeGame=g.id;renderBoxScores()};gt.appendChild(b)});
  if(admin){const ab=document.createElement('button');ab.className='game-tab-add';ab.innerHTML='<span class="material-symbols-outlined" style="font-size:14px">add</span>New Game';ab.onclick=addGame;gt.appendChild(ab)}

  const area=document.getElementById('boxScoreArea');
  if(!activeGame||!D.games.find(g=>g.id===activeGame)){area.innerHTML=D.games.length?'<div class="empty"><div class="empty-text">Select a game above.</div></div>':'<div class="empty"><div class="empty-text">No games yet.</div></div>';return}
  const g=D.games.find(x=>x.id===activeGame);const gi=D.games.indexOf(g);const es=enabledStats();

  if(admin){
    let html=`<div class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><h3 style="font-size:18px;font-weight:900">Game ${gi+1}${g.date?' — '+fmtDateShort(g.date):''}</h3><div style="display:flex;gap:6px"><button class="save-btn" onclick="saveNow(this)">Save</button><button class="btn btn-sm btn-danger" id="delgame-${gi}" onclick="delGame(${gi},this)">Delete</button></div></div>`;
    // Game form — reordered: Date, Opponent, Location, Weather, Runs For, Runs Against
    const dateMin=activeSeason+'-01-01', dateMax=activeSeason+'-12-31';
    html+=`<div class="game-form">`;
    html+=`<div><label>Date</label><input type="date" value="${esc(g.date||'')}" min="${dateMin}" max="${dateMax}" onchange="updGameNoRerender('${g.id}','date',this.value);updateGameTab('${g.id}',this.value)"></div>`;
    html+=`<div><label>Opponent</label><input value="${esc(g.opponent||'')}" placeholder="Team" oninput="updGameNoRerender('${g.id}','opponent',this.value)"></div>`;
    html+=`<div><label>Location</label><input value="${esc(g.location||'')}" placeholder="Field name or address" oninput="updGameNoRerender('${g.id}','location',this.value)"></div>`;
    html+=`<div><label>Conditions</label><input value="${esc(g.weather||'')}" placeholder="Sunny, rainy, etc." oninput="updGameNoRerender('${g.id}','weather',this.value)"></div>`;
    html+=`<div><label>Runs For</label><input type="number" min="0" value="${esc(g.runsFor||'')}" placeholder="0" oninput="updGameNoRerender('${g.id}','runsFor',this.value)"></div>`;
    html+=`<div><label>Runs Against</label><input type="number" min="0" value="${esc(g.runsAgainst||'')}" placeholder="0" oninput="updGameNoRerender('${g.id}','runsAgainst',this.value)"></div>`;
    html+=`</div>`;
    // Location → Google Maps link if filled
    if(g.location){html+=`<div style="margin-bottom:10px"><a href="https://www.google.com/maps/search/${encodeURIComponent(g.location)}" target="_blank" rel="noopener" style="font-size:11px;color:var(--blue);display:inline-flex;align-items:center;gap:3px;text-decoration:none"><span class="material-symbols-outlined" style="font-size:14px">map</span>Open in Google Maps</a></div>`}
    // Multi-select roster picker ABOVE the table
    const currentNames=new Set((g.players||[]).map(p=>(p.name||'').trim().toLowerCase()));
    const available=D.roster.filter(r=>r.name&&!currentNames.has(r.name.trim().toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
    if(available.length){
      html+=`<div class="roster-picker"><span style="font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.6px;margin-right:6px">Add:</span>`;
      available.forEach(r=>{
        html+=`<button class="roster-picker-chip" onclick="addNamedPlayerToGame('${g.id}','${esc(r.name.replace(/'/g,"\\'"))}')">${esc(r.name)}${r.number?' <span class="rp-num">#'+esc(r.number)+'</span>':''}</button>`;
      });
      html+=`<button class="roster-picker-chip" style="border-style:dashed;color:var(--mut)" onclick="addGuestToGame('${g.id}')"><span class="material-symbols-outlined" style="font-size:13px">person_add</span>Guest</button>`;
      html+=`</div>`;
    }else{
      html+=`<div style="margin-bottom:10px"><button class="btn btn-sm btn-ghost" onclick="addGuestToGame('${g.id}')"><span class="material-symbols-outlined" style="font-size:13px">person_add</span> Guest</button></div>`;
    }
    // Selection toolbar + stat table
    html+=`<div class="bs-toolbar" id="bsToolbar-${g.id}"></div>`;
    html+=`<div class="table-wrap"><table><thead><tr><th style="width:24px"></th><th style="width:24px"></th><th>Player</th>`;es.forEach(s=>{html+=`<th title="${esc(s.full)}">${esc(s.label)}</th>`});html+=`</tr></thead><tbody id="bsBody-${g.id}">`;
    (g.players||[]).forEach((p,pi)=>{html+=`<tr class="bs-row" draggable="true" data-pid="${p.id}" data-gid="${g.id}" data-idx="${pi}"><td><input type="checkbox" class="row-check" data-pid="${p.id}" onchange="updateBsToolbar('${g.id}')"></td><td><span class="drag-handle material-symbols-outlined">drag_indicator</span></td><td><input class="cell-input wide" value="${esc(p.name||'')}" placeholder="Name" oninput="updPlayer('${g.id}','${p.id}','name',this.value)"></td>`;es.forEach(s=>{html+=`<td><input class="cell-input" type="number" min="0" value="${esc(p[s.id]||'')}" oninput="updPlayer('${g.id}','${p.id}','${s.id}',this.value)"></td>`});html+=`</tr>`});
    if((g.players||[]).length){html+=`<tr class="total-row"><td></td><td></td><td>TEAM</td>`;es.forEach(s=>{html+=`<td>${(g.players||[]).reduce((sum,p)=>sum+n(p[s.id]),0)}</td>`});html+=`</tr>`}

let dragSrcRow=null;
function initBoxScoreDrag(gid){
  const tbody=document.getElementById('bsBody-'+gid);if(!tbody)return;
  const rows=tbody.querySelectorAll('tr.bs-row');
  rows.forEach(row=>{
    row.addEventListener('dragstart',e=>{
      dragSrcRow=row;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',row.dataset.pid);
    });
    row.addEventListener('dragend',()=>{
      row.classList.remove('dragging');
      dragSrcRow=null;
      rows.forEach(r=>r.style.borderTop='');
    });
    row.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      if(dragSrcRow&&dragSrcRow!==row){
        row.style.borderTop='2px solid var(--acc)';
      }
    });
    row.addEventListener('dragleave',()=>{
      row.style.borderTop='';
    });
    row.addEventListener('drop',e=>{
      e.preventDefault();
      row.style.borderTop='';
      if(!dragSrcRow||dragSrcRow===row)return;
      const g=D.games.find(x=>x.id===gid);if(!g||!g.players)return;
      const fromIdx=parseInt(dragSrcRow.dataset.idx);
      const toIdx=parseInt(row.dataset.idx);
      if(isNaN(fromIdx)||isNaN(toIdx))return;
      // Move the player in the array
      const [moved]=g.players.splice(fromIdx,1);
      g.players.splice(toIdx,0,moved);
      renderBoxScores();
    });
  });
}

/* ═══ CSV IMPORT ═══ */
function parseCsvText(text){
  // Simple CSV parser that handles quoted fields
  const rows=[];let row=[];let cell='';let inQuote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuote){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++}
      else if(c==='"'){inQuote=false}
      else{cell+=c}
    }else{
      if(c==='"'){inQuote=true}
      else if(c===','){row.push(cell);cell=''}
      else if(c==='\n'||c==='\r'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(cell);rows.push(row);row=[];cell='';
      }else{cell+=c}
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}

function handleCsvImport(file){
  if(!file)return;
  const result=document.getElementById('csvImportResult');
  result.innerHTML='<p style="color:var(--mut)">Parsing...</p>';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const rows=parseCsvText(e.target.result);
      const game=parseCsvToGame(rows);
      if(!game){result.innerHTML='<p style="color:var(--loss)">Could not parse this CSV. Make sure it\'s a game box score tab from the Stat Hub sheet.</p>';return}
      // Show preview
      const pCount=game.players.length;
      const resultTag=game.runsFor&&game.runsAgainst?(parseInt(game.runsFor)>parseInt(game.runsAgainst)?'W':'L'):'?';
      let preview=`<div class="s-card" style="margin-top:12px"><h3>Preview</h3>`;
      preview+=`<p style="font-size:13px;margin-bottom:8px"><strong>${game.date||'No date'}</strong> vs <strong>${game.opponent||'Unknown'}</strong> — ${game.runsFor||'?'}-${game.runsAgainst||'?'} (${resultTag})</p>`;
      preview+=`<p style="font-size:12px;color:var(--mut);margin-bottom:8px">${game.location||'No location'} · ${pCount} players</p>`;
      if(pCount){
        preview+=`<div style="font-size:11px;color:#666;margin-bottom:10px">`;
        game.players.forEach(p=>{preview+=`<span style="display:inline-block;padding:2px 8px;background:#f4f2ec;border-radius:4px;margin:2px">${esc(p.name||'?')}</span>`});
        preview+=`</div>`;
      }
      preview+=`<div style="display:flex;gap:8px"><button class="save-btn" onclick="commitCsvImport()">Import Game</button><button class="cancel-btn" onclick="document.getElementById('csvImportResult').innerHTML=''">Cancel</button></div></div>`;
      result.innerHTML=preview;
      // Stash the parsed game for commit
      window._pendingImport=game;
    }catch(err){
      result.innerHTML=`<p style="color:var(--loss)">Parse error: ${esc(err.message)}</p>`;
    }
  };
  reader.readAsText(file);
}

function parseCsvToGame(rows){
  if(rows.length<8)return null;
  const months={January:'01',February:'02',March:'03',April:'04',May:'05',June:'06',July:'07',August:'08',September:'09',October:'10',November:'11',December:'12'};

  // Row 2: matchup, Row 3: location+date + team1 score, Row 4: team2 score
  const matchup=(rows[2]&&rows[2][2]||'').trim();
  const locRaw=(rows[3]&&rows[3][2]||'').trim();

  // Opponent
  let opponent='',isAway=false;
  if(matchup){
    if(matchup.includes('@')){
      const parts=matchup.split('@');
      if(parts[0].toLowerCase().includes('groove')||parts[0].toLowerCase().includes('new york')){
        isAway=true;opponent=parts[1].trim();
      }else{
        opponent=parts[0].trim();
      }
    }else{
      const m=matchup.match(/vs\.?\s*(.+)/i);
      if(m)opponent=m[1].trim();
    }
  }

  // Date
  let dateStr='';
  const dm=locRaw.match(/(\w+)\s+(\d{1,2}),?\s*(\d{4})/);
  if(dm&&months[dm[1]])dateStr=`${dm[3]}-${months[dm[1]]}-${String(dm[2]).padStart(2,'0')}`;

  // Location
  const location=locRaw.split(',')[0].trim();

  // Find R column in row 2
  let rCol=null;
  if(rows[2])for(let i=0;i<rows[2].length;i++){if(rows[2][i].trim()==='R'){rCol=i;break}}

  // Determine Groove row
  let grooveRow=4,oppRow=3;
  const r3=(rows[3]||[]).slice(16,22).join('').toUpperCase();
  const r4=(rows[4]||[]).slice(16,22).join('').toUpperCase();
  if(r3.includes('GROOVE'))      {grooveRow=3;oppRow=4}
  else if(r4.includes('GROOVE')) {grooveRow=4;oppRow=3}
  else if(r3.includes('AWAY')&&isAway){grooveRow=3;oppRow=4}
  else if(r4.includes('HOME')&&!isAway){grooveRow=4;oppRow=3}
  else if(isAway){grooveRow=3;oppRow=4}

  const pn=v=>{if(!v)return '';const c=v.replace(/[^0-9.\-]/g,'');try{return String(parseInt(parseFloat(c)))}catch(e){return ''}};
  const runsFor=rCol!==null&&rows[grooveRow]&&rCol<rows[grooveRow].length?pn(rows[grooveRow][rCol]):'';
  const runsAgainst=rCol!==null&&rows[oppRow]&&rCol<rows[oppRow].length?pn(rows[oppRow][rCol]):'';

  // Find BATTING header
  let headerRow=null;
  for(let ri=0;ri<Math.min(rows.length,15);ri++){
    if(rows[ri]&&rows[ri][2]&&rows[ri][2].trim()==='Player'){headerRow=ri;break}
  }
  if(!headerRow)return null;

  // Column map
  const hdr=rows[headerRow];
  const statKeys={'Player':'name','#':'number','POS':'position','PA':'pa','AB':'ab','R':'r','H':'h','1B':'singles','2B':'doubles','3B':'triples','HR':'hr','RBI':'rbi','BB':'bb','K':'so','HBP':'hbp','SF':'sf','SB':'sb','CS':'cs'};
  const colMap={};
  hdr.forEach((c,ci)=>{
    const clean=c.trim().replace(/\n/g,'');
    if(statKeys[clean])colMap[statKeys[clean]]=ci;
    if(clean.includes('GI')&&clean.includes('DP'))colMap['gidp']=ci;
  });

  // Parse players
  const players=[];
  for(let ri=headerRow+1;ri<Math.min(headerRow+30,rows.length);ri++){
    const row=rows[ri];if(!row)break;
    const nameCi=colMap.name||2;
    if(nameCi>=row.length)break;
    const name=row[nameCi].trim();
    if(!name){
      const paCi=colMap.pa||5;
      if(paCi<row.length&&pn(row[paCi]))break;
      continue;
    }
    if(['PITCHING','BATTING','Player','Note:','Note'].includes(name.toUpperCase()))break;

    const player={id:uid(),name,rosterId:''};
    for(const[sk,ci]of Object.entries(colMap)){
      if(['name','number','position'].includes(sk))continue;
      if(ci<row.length){const v=pn(row[ci]);if(v)player[sk]=v}
    }
    players.push(player);
  }

  return{id:uid(),date:dateStr,opponent,location,runsFor,runsAgainst,weather:'',notes:'',players};
}

function commitCsvImport(){
  const game=window._pendingImport;
  if(!game)return;
  D.games.push(game);
  activeGame=game.id;
  activeTab='boxscores';
  saveNow();
  window._pendingImport=null;
  renderAll();
}

function renderAll(){renderNav();renderTabs();renderHome();renderRoster();renderBoxScores();renderPlayerStats();renderLeaderboards();renderTrendTracker();renderStatNotes();renderSettings()}

/* ═══ GRASS FIELD ANIMATION ═══ */
let grassAnimId = null;
function initGrass() {
  if (grassAnimId) return; // already running
  const canvas = document.getElementById('grassCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Blade pool — generated once, animated continuously
  let blades = [];
  const BLADE_COUNT = 220;
  const COLORS = ['#7db36a','#6ea55c','#8dc07a','#5c9648','#9acc88','#a3d196','#78ab65'];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    generateBlades();
  }

  function generateBlades() {
    blades = [];
    const w = canvas.width, h = canvas.height;
    for (let i = 0; i < BLADE_COUNT; i++) {
      blades.push({
        x: Math.random() * w,
        baseY: h - Math.random() * 90,
        height: 30 + Math.random() * 70,
        width: 1.5 + Math.random() * 2.5,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.5,
        amplitude: 3 + Math.random() * 8
      });
    }
  }

  let time = 0;
  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Soft gradient ground
    const grd = ctx.createLinearGradient(0, h * 0.7, 0, h);
    grd.addColorStop(0, 'rgba(120,170,100,0)');
    grd.addColorStop(0.4, 'rgba(120,170,100,0.03)');
    grd.addColorStop(1, 'rgba(100,155,80,0.08)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, h * 0.7, w, h * 0.3);

    // Draw blades
    for (const b of blades) {
      const sway = Math.sin(time * b.speed + b.phase) * b.amplitude;
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.x, b.baseY);
      // Quadratic curve for natural bend
      ctx.quadraticCurveTo(
        b.x + sway * 0.6, b.baseY - b.height * 0.5,
        b.x + sway, b.baseY - b.height
      );
      ctx.stroke();
      ctx.restore();
    }
    time += 0.016;
    grassAnimId = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
}

// On load: handle admin mode for local (no-Firebase) mode
loadData(()=>{
  renderAll();
  renderAuthBar();
  if(!firebaseReady && isAdmin()){
    document.body.classList.add('admin-mode');
    initGrass();
  }
});
