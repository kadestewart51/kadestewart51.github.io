<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrooveHub · NY Groove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Sen:wght@400..800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DGRN12PHP1"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-DGRN12PHP1');</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head>
<body>
<canvas id="grassCanvas"></canvas>
<nav class="sidebar" id="sidebar"></nav>
<div class="composer-overlay" id="composerOverlay"><div class="composer" id="composerInner"></div></div>
<div class="profile-modal-overlay" id="profileModalOverlay"><div class="profile-modal" id="profileModalInner"></div></div>
<div class="log-modal-overlay" id="logModalOverlay"><div class="log-modal" id="logModalInner"></div></div>
<div class="reaction-picker" id="reactionPicker"></div>
<div class="fan-modal-overlay" id="fanModalOverlay" onclick="if(event.target===this)closeFanModal()"><div class="fan-modal" id="fanModalInner"></div></div>
<div class="season-bar" id="seasonBar"></div>
<div class="page-wrap">
<div class="auth-bar" id="authBar"></div>
<div class="profile-pill" id="profilePill"></div>
<div class="header">
  <div class="header-inner">
    <div class="header-left-group">
      <div class="header-team" id="headerTeam">Welcome to GrooveHub</div>
      <div class="header-record" id="headerRecord"></div>
    </div>
    <div class="header-right-group">
      <div class="season-switcher" id="seasonSwitcher">
        <button class="ts-btn ts-btn-24" onclick="switchSeason('2024')">2024</button>
        <button class="ts-btn ts-btn-25" onclick="switchSeason('2025')">2025</button>
        <button class="ts-btn ts-btn-26" onclick="switchSeason('2026')">2026</button>
      </div>
      <div id="signInSlot"></div>
    </div>
  </div>
</div>
<div class="game-day-banner" id="gameDayBanner"></div>
<div class="showcase-badge" id="showcaseBadge"><span class="sb-dot"></span>You're viewing real data from the 2024 season — <a href="https://docs.google.com/spreadsheets/d/1vFn1eYuYG4SQ_C8OQ-yOL_Nk2iubau-TU45tNtDggeQ/edit?usp=sharing" target="_blank" rel="noopener" style="color:var(--pri);text-decoration:underline">see our original StatHub!</a></div>
<main class="main">
<div class="tab" id="tab-home"><div class="hero-section"><button class="hero-btn" id="heroBtn" onclick="heroClick()">POST SOMETHING</button></div><div id="upcomingGames"></div><div class="feed" id="feedArea"></div></div>
<div class="tab" id="tab-roster"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px"><div><h2 class="sec-title">The Roster</h2><p class="sec-hint" id="rosterHint">The 2026 New York Groove.</p></div><div id="rosterAdminBtns"></div></div><div class="roster-grid" id="rosterGrid"></div></div>
<div class="tab" id="tab-boxscores"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px"><h2 class="sec-title">Box Scores</h2><div id="boxAdminBtns"></div></div><div class="game-tabs" id="gameTabs"></div><div id="boxScoreArea"></div></div>
<div class="tab" id="tab-playerstats"><h2 class="sec-title">Player Stats</h2><p class="sec-hint">The Player Tracker 5000, reborn.</p><div id="playerStatsArea"></div></div>
<div class="tab" id="tab-leaderboards"><h2 class="sec-title">Leaderboards</h2><div class="leaders-grid" id="leadersGrid"></div></div>
<div class="tab" id="tab-trendtracker"><h2 class="sec-title">TrendTracker 5000</h2><div class="trend-pills" id="trendPills"></div><div class="trend-pills" id="trendPlayerPills" style="margin-top:6px"></div><div class="chart-wrap"><canvas id="trendChart" height="260"></canvas></div><div id="trendTable"></div></div>
<div class="tab" id="tab-statnotes"><h2 class="sec-title">Stat Notes</h2><div class="card card-pad"><textarea class="s-textarea" id="statNotesArea" style="min-height:250px" oninput="D.cfg.statNotes=this.value"></textarea></div></div>
<div class="tab" id="tab-settings"><h2 class="sec-title">⚙ Settings</h2><div class="settings-nav" id="settingsNav"></div><div id="settingsArea"></div></div>
</main>
<footer class="footer" id="siteFooter">NY Groove · 2026</footer>
</div>
<div class="save-bar" id="saveBar">
  <div class="sb-left"><span class="sb-dirty-dot"></span><span class="material-symbols-outlined">edit</span><span class="sb-label" id="saveBarLabel">Editing</span></div>
  <div class="sb-right"><button class="sb-discard" id="saveBarDiscard" onclick="discardEdits()">Discard</button><button class="sb-save" id="saveBarSave" onclick="saveBarSave()">Save</button></div>
</div>
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()"><span class="material-symbols-outlined">close</span></button>
  <button class="lb-nav lb-prev" id="lbPrev" onclick="lbNav(-1)"><span class="material-symbols-outlined">chevron_left</span></button>
  <img id="lbImg" class="lb-img">
  <button class="lb-nav lb-next" id="lbNext" onclick="lbNav(1)"><span class="material-symbols-outlined">chevron_right</span></button>
  <div class="lb-counter" id="lbCounter"></div>
</div>
<script src="script.js"></script>
</body>
</html>
